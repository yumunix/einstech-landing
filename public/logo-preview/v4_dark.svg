<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF1744" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="320" fill="#030508"/>

  <!-- Glow halo around the i-dot -->
  <circle cx="222" cy="50" r="55" fill="url(#dotGlow)"/>
  <!-- Red i-dot (brand signature) -->
  <circle cx="222" cy="50" r="17" fill="#FF1744"/>

  <text x="40" y="220" font-family="Space Grotesk,Arial Black,sans-serif" font-weight="700" font-size="200" letter-spacing="-6"><tspan fill="#FF1744">EINS</tspan><tspan fill="#F5F5F5">TECH</tspan></text>

  <!-- Korean subtitle line -->
  <text x="44" y="280" font-family="Noto Sans CJK KR" font-weight="400" font-size="22" fill="#8B94A7" letter-spacing="6">(주) 아인스테크  ·  SOLUTION LEADER</text>
</svg>
