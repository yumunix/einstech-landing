<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#030508"/>

  <!-- Outer glow halo around the dot -->
  <circle cx="32" cy="16" r="18" fill="url(#halo)"/>

  <!-- The red dot itself -->
  <circle cx="32" cy="16" r="6" fill="#FF1744"/>

  <!-- Highlight sparkle -->
  <circle cx="30" cy="14" r="2.4" fill="url(#sparkle)"/>

  <!-- "i" stem -->
  <rect x="28" y="26" width="8" height="28" rx="1.5" fill="url(#rg)"/>
</svg>
